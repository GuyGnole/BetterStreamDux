[package]
name = "betterstreamdux"
version = "0.1.0"
edition = "2024"
description = "Stream Deck MK.2 controller for Linux, with one module per application"
publish = false
default-run = "betterstreamdux"

[[bin]]
name = "betterstreamdux"
path = "src/main.rs"

[[bin]]
name = "betterstreamdux-gui"
path = "src/bin/gui.rs"

[dependencies]
ab_glyph = "0.2"            # draws text (labels, clock) on key images
anyhow = "1"                # simple error handling
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # local time for the clock
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }  # GUI editor (egui)
elgato-streamdeck = "0.14"  # talks to the Stream Deck over HID
env_logger = "0.11"         # prints logs, controlled by RUST_LOG
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
rfd = "0.18"                # GUI: native "choose an icon" file dialog (xdg portal)
serde = { version = "1", features = ["derive"] }
serde_json = "1"            # Discord RPC messages and login token are JSON
toml = "1.2"                # reads config.toml
ureq = "3"                  # HTTP client, downloads Spotify album covers
zbus = "5"                  # D-Bus, used by the Spotify module (MPRIS)

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"     # noise for an application
missing_panics_doc = "allow"
